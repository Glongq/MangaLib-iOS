name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          ls /Applications | grep -i Xcode || true
          sudo xcode-select -s /Applications/Xcode_26.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List Xcode project targets and schemes
        run: xcodebuild -list -project MangaLib.xcodeproj

      - name: Build for device (unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project MangaLib.xcodeproj \
            -scheme MangaLib \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_DEBUG_DYLIB=NO \
            build \
            | tee build/xcodebuild.log

      - name: Print build output diagnostics
        run: |
          set +e
          echo "=== pwd ==="
          pwd
          echo "=== xcodebuild -version ==="
          xcodebuild -version
          echo "=== find build -name \"*.app\" ==="
          find build -name "*.app"
          echo "=== find build -name \"MangaLib\" ==="
          find build -name "MangaLib"
          echo "=== find build -type f | head -100 ==="
          find build -type f | head -100
          echo "=== du -sh build ==="
          du -sh build
          echo "=== du -sh build/DerivedData ==="
          du -sh build/DerivedData
          echo "=== ls -R build/DerivedData/Build/Products ==="
          ls -R build/DerivedData/Build/Products

      - name: Verify self-contained executable (no debug dylib split)
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/MangaLib.app"
          if [ -f "$APP_PATH/MangaLib.debug.dylib" ]; then
            echo "ERROR: MangaLib.debug.dylib is present — Xcode built a debug-dylib-split executable."
            echo "This binary dlopens @rpath/MangaLib.debug.dylib, which only resolves inside an Xcode debug session"
            echo "and fails to launch when sideloaded (e.g. via LiveContainer)."
            echo "Fix: ensure ENABLE_DEBUG_DYLIB=NO is passed to xcodebuild."
            exit 1
          fi
          if otool -L "$APP_PATH/MangaLib" 2>/dev/null | grep -q "debug.dylib"; then
            echo "ERROR: main executable still links against a debug dylib."
            exit 1
          fi
          echo "OK: MangaLib is a self-contained executable."

      - name: Create MangaLib.ipa
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Debug-iphoneos/MangaLib.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r MangaLib.ipa Payload
          cd ..
          ls -la build/MangaLib.ipa
          du -sh build/MangaLib.ipa
          unzip -l build/MangaLib.ipa | head -20

      - name: Upload MangaLib.ipa
        uses: actions/upload-artifact@v4
        with:
          name: MangaLib-ipa
          path: build/MangaLib.ipa
          if-no-files-found: error
