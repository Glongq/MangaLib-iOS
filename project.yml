name: MangaLib
options:
  bundleIdPrefix: com.glongq
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.93.0"
    CURRENT_PROJECT_VERSION: "447"

targets:
  MangaLib:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glongq.MangaLib
        INFOPLIST_KEY_CFBundleDisplayName: MangaLib
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
        # Allows plain HTTP to local-network addresses (RFC1918/loopback/
        # .local) — needed for the Stage-B translation rephrase pass
        # talking to a local LM Studio server (see
        # App/OCRTranslation/RephraseClient.swift). Does not open up
        # arbitrary public-internet HTTP.
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
    scheme:
      testTargets: []
