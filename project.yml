name: MangaLib
options:
  bundleIdPrefix: com.glongq
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.22.7"
    CURRENT_PROJECT_VERSION: "76"

targets:
  MangaLib:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Features
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.glongq.MangaLib
        INFOPLIST_KEY_CFBundleDisplayName: MangaLib
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: NO
    scheme:
      testTargets: []
